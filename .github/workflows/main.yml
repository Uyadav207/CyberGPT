name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Run linting
        run: bun run check
      
      - name: Run tests
        run: bun run test
      
      - name: Run type checking
        run: bun run type-check

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint
      
      - name: Run type checking
        run: npm run type-check
      
      - name: Run tests
        run: npm run test
      
      - name: Build application
        run: npm run build

  # Mirror to GitLab (only on main branch)
  mirror:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "uty-at-tu-chemnitz.de"
          git config --global user.email "utkarsh.yadav@s2023.tu-chemnitz.de"
      
      - name: Push to GitLab main Branch
        env:
          GITLAB_TOKEN: ${{secrets.GITLAB_TOKEN_ACCESS}}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.hrz.tu-chemnitz.de/vsr/edu/advising/ma-team-shivaprasad-yadav.git"
          git push gitlab HEAD:main --force